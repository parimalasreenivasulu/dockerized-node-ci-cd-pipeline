name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # Optional: Add a linting or test step if configured in package.json
      # - name: Run Linter
      #   run: npm run lint
      # - name: Run Unit Tests
      #   run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false  # Set to true if you want to push to Docker Hub / GHCR with secrets
          tags: dockerized-node-app:latest
          cache-from: type=gha
          cache-to: type=gha-mode=max